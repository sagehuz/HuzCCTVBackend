# Huz CCTV Server — nginx reverse proxy (HTTP only)
#
# Install:
#   sudo cp deploy/nginx-huzcctv.conf /etc/nginx/sites-available/huzcctv
#   sudo ln -s /etc/nginx/sites-available/huzcctv /etc/nginx/sites-enabled/huzcctv
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then obtain a Let's Encrypt certificate (adds HTTPS + auto-redirect):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d cctv.example.com
#
# After HTTPS is active, set COOKIE_SECURE=true in /opt/huzcctv/.env and restart:
#   sudo systemctl restart huzcctv
#
# Replace cctv.example.com with your real domain.

server {
    listen 80;
    listen [::]:80;
    server_name cctv.example.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket signaling (gorilla/websocket) — must be upgraded
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
