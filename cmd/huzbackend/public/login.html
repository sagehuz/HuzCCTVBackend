<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title data-i18n="login.title">Sign in · Huz CCTV</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <header class="site-header" id="app-header"></header>

    <main class="auth-shell">
      <section class="auth-card" aria-label="Sign in" data-i18n-aria="login.aria">
        <div class="auth-brand">
          <span class="brand-mark"></span>
          <h1>Huz CCTV</h1>
          <p data-i18n="login.subtitle">Sign in to continue managing your surveillance system</p>
        </div>

        <div class="alert alert-error hidden" id="loginError" role="alert">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
          <span id="loginErrorText"></span>
        </div>

        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="username" data-i18n="login.username">Username</label>
            <input
              class="form-control"
              id="username"
              name="username"
              type="text"
              placeholder="Enter your username"
              data-i18n-placeholder="login.username.placeholder"
              autocomplete="username"
              required
              autofocus
            />
          </div>

          <div class="form-group">
            <label class="form-label" for="password" data-i18n="login.password">Password</label>
            <div class="password-wrap">
              <input
                class="form-control"
                id="password"
                name="password"
                type="password"
                placeholder="Enter your password"
                data-i18n-placeholder="login.password.placeholder"
                autocomplete="current-password"
                required
              />
              <button
                type="button"
                class="password-toggle"
                id="togglePassword"
                aria-label="Show / hide password"
                data-i18n-aria="login.toggle.aria"
              >
                <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <label class="checkbox-row mb-1">
            <input type="checkbox" id="remember" checked />
            <span data-i18n="login.remember">Remember me on this browser</span>
          </label>
          <p class="text-muted" style="margin: 6px 0 0; font-size: 12.5px; line-height: 1.5" data-i18n="login.remember.hint">
            Your session will be kept for a long time, so you will not need to sign in again every time you open the page.
          </p>

          <button class="btn btn-primary btn-block mt-3" id="submitBtn" type="submit">
            <span data-i18n="login.submit">Sign in</span>
          </button>
        </form>

        <div class="auth-divider" data-i18n="login.divider">Surveillance system</div>
        <p class="footer-note" id="footerNote">© <span id="year"></span> Huz CCTV · Safe · Secure · Reliable</p>
      </section>
    </main>

    <script src="/js/i18n.js"></script>
    <script src="/js/common.js"></script>
    <script>
      (function () {
        'use strict';

        var form = document.getElementById('loginForm');
        var usernameEl = document.getElementById('username');
        var passwordEl = document.getElementById('password');
        var rememberEl = document.getElementById('remember');
        var toggleBtn = document.getElementById('togglePassword');
        var submitBtn = document.getElementById('submitBtn');
        var errorBox = document.getElementById('loginError');
        var errorText = document.getElementById('loginErrorText');

        var lastError = null;

        function applyFooter() {
          document.getElementById('footerNote').textContent = HuzApp.t('login.footer', {
            year: String(new Date().getFullYear()),
          });
        }

        function showError(message) {
          lastError = message || HuzApp.t('login.error.generic');
          errorText.textContent = lastError;
          errorBox.classList.remove('hidden');
        }

        function renderError() {
          if (lastError) errorText.textContent = lastError;
        }

        function hideError() {
          lastError = null;
          errorBox.classList.add('hidden');
        }

        applyFooter();

        toggleBtn.addEventListener('click', function () {
          var isPassword = passwordEl.type === 'password';
          passwordEl.type = isPassword ? 'text' : 'password';
          toggleBtn.setAttribute(
            'aria-label',
            isPassword ? HuzApp.t('login.toggle.hide') : HuzApp.t('login.toggle.show')
          );
          toggleBtn.innerHTML = isPassword
            ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><path d="m1 1 22 22"/></svg>'
            : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>';
        });

        form.addEventListener('submit', async function (e) {
          e.preventDefault();
          hideError();

          var username = usernameEl.value.trim();
          var password = passwordEl.value;
          if (!username || !password) {
            showError(HuzApp.t('login.error.required'));
            return;
          }

          submitBtn.disabled = true;
          submitBtn.innerHTML = '<span>' + HuzApp.t('login.signingIn') + '</span>';

          try {
            await HuzApp.api('/api/auth/login', {
              method: 'POST',
              body: {
                username: username,
                password: password,
                remember: rememberEl.checked,
              },
            });
            localStorage.setItem('huz_authed', '1');
            window.location.href = HuzApp.loginRedirect();
          } catch (err) {
            submitBtn.disabled = false;
            submitBtn.innerHTML = '<span>' + HuzApp.t('login.submit') + '</span>';
            showError(err.message || HuzApp.t('login.error.failed'));
            passwordEl.select();
          }
        });

        document.addEventListener('huz:langchange', function () {
          applyFooter();
          renderError();
        });

        HuzApp.init({ requireAuth: false }).then(function (user) {
          if (user) {
            window.location.href = HuzApp.loginRedirect();
          }
        });
      })();
    </script>
  </body>
</html>
